<!DOCTYPE html>
<html lang="tr" data-lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Code TR — Çalışma Notları</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/reader.css?v=16">
  <style>

</head>
<body>

<header class="topbar">
  <div class="topbar-inner">

      <span class="brand-title">Clean Code — Çalışma Notları</span>
      <span class="brand-sub ui-pair" id="crumb"></span>

    <div class="lang-switch" role="group" aria-label="Dil">
      <button data-lang="tr">TR</button>
      <button data-lang="en">EN</button>
      <button data-lang="both">EN+TR</button>

  </div>
</header>

<main class="desk">
  <div class="book notes-book" id="book">
    <article class="sheet"><div class="page-body"><p class="status">Yükleniyor…</p></div></article>
  </div>

<div class="modal-overlay" id="modal" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-header ui-pair"><h3 id="modal-title"></h3><button class="modal-close" id="modal-close" aria-label="Kapat">×</button></div>
    <div class="modal-body" id="modal-body"></div>

<script src="js/highlight.js?v=16"></script>
